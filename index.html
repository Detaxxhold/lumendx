<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMENDX | Football World</title>
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1626">
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1626;color:#fff}
header{padding:20px 16px;background:#101d32;border-bottom:3px solid #18c8ff}
.logo{font-size:28px;font-weight:bold;letter-spacing:3px;cursor:pointer}
.logo span{color:#18c8ff}
header p{color:#aabbd1;margin:6px 0 12px}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:13px;border-radius:10px;border:1px solid #1d3354;background:#0b1626;color:#fff;font-size:16px}
#go{background:#18c8ff;color:#06121f;border:0;border-radius:10px;padding:0 18px;font-weight:bold;font-size:16px;cursor:pointer}
.langs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.langs button,.liga-btn{background:#0b1626;color:#fff;border:1px solid #1d3354;border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.langs button.on,.liga-btn.sel{background:#18c8ff;color:#06121f;font-weight:bold}
.leagues{display:flex;gap:8px;overflow:auto;padding:14px 16px}
main{padding:0 16px 20px}
.res{background:#101d32;border:1px solid #1d3354;border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer}
.res h3{margin:0 0 6px;color:#18c8ff}
.res p{margin:0;color:#b9c8da;line-height:1.5;font-size:15px}
.back{background:none;border:0;color:#18c8ff;font-size:16px;padding:12px 0;font-weight:bold;cursor:pointer}
.art h1{margin:8px 0}
.art img{max-width:100%;border-radius:12px}
.art p{line-height:1.8;color:#d3deec;font-size:17px}
.art h2{color:#18c8ff;font-size:20px;margin:24px 0 4px}
.art a{color:#18c8ff;font-weight:bold}
.msg{color:#9aacc3;text-align:center;padding:30px 0}
.liga-nav{display:flex;background:#101d32;border-radius:10px;overflow:hidden;margin:15px 0;border:1px solid #1d3354}
.liga-nav-btn{flex:1;background:none;border:none;color:#9aacc3;padding:12px 6px;font-size:14px;font-weight:bold;cursor:pointer}
.liga-nav-btn.active{color:#fff;background:#183153;border-bottom:3px solid #18c8ff}
.tw{overflow-x:auto}
.st{width:100%;border-collapse:collapse;background:#101d32;border:1px solid #1d3354;font-size:13px}
.st th{background:#142438;color:#8ab4f8;padding:9px 5px;text-align:center;font-weight:normal}
.st td{padding:9px 5px;text-align:center;border-bottom:1px solid #1d3354}
.st th:nth-child(2),.st td:nth-child(2){text-align:left;font-weight:bold;white-space:nowrap}
.st td:first-child{border-left:4px solid transparent}
.st tr.cl td:first-child{border-left-color:#18c8ff}
.st tr.el td:first-child{border-left-color:#f5a623}
.st tr.co td:first-child{border-left-color:#4caf50}
.st tr.rel td:first-child{border-left-color:#e53935}
.pts{font-weight:bold;color:#18c8ff}
.cr{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:8px;border-radius:0}
.legend{font-size:12px;color:#9aacc3;line-height:1.8;margin-top:10px}
.sub{color:#8ab4f8;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
.mc{background:#101d32;border:1px solid #1d3354;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.mc .d{font-size:12px;color:#9aacc3;margin-bottom:6px}
.mc .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc .t{font-weight:bold;font-size:14px;line-height:2}
.sc{background:#183153;color:#18c8ff;padding:6px 12px;border-radius:8px;font-weight:bold;white-space:nowrap}
/* Бомбардирлер үчүн кошумча стилдер */
.player-row{display:flex;align-items:center;gap:14px}
.player-avatar{width:42px;height:42px;border-radius:50%;background:#183153;border:1px solid #18c8ff;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#18c8ff;font-size:15px;flex-shrink:0}
footer{text-align:center;padding:25px;color:#9aacc3}
</style>
</head>
<body>
<header>
<div class="logo" onclick="home()">LUMEN<span>DX</span></div>
<p>Search any football topic in the world.</p>
<div class="row">
<input id="q" placeholder="Messi, Real Madrid, World Cup..." onkeydown="if(event.key=='Enter')search()">
<button id="go" onclick="search()">Search</button>
</div>
<div class="langs" id="langs"></div>
</header>
<div class="leagues" id="leagues"></div>
<main id="app"></main>
<footer>© 2026 LUMENDX | Your World. Your Football.</footer>
<script>
var lang="en";
var LANGS={en:"English",ru:"Русский",ky:"Кыргызча"};
var SUF={en:" football",ru:" футбол",ky:" футбол"};
var results=[];
var cur="";
var LEG1="<span style='color:#18c8ff'>■</span> Champions League &nbsp;<span style='color:#f5a623'>■</span> Europa League &nbsp;<span style='color:#4caf50'>■</span> Conference League &nbsp;<span style='color:#e53935'>■</span> Relegation";
var LG={
 PD:{n:"La Liga",f:"🇪🇸",z:[4,5,6,18],l:LEG1},
 PL:{n:"Premier League",f:"🇬🇧",z:[4,5,6,18],l:LEG1},
 SA:{n:"Serie A",f:"🇮🇹",z:[4,5,6,18],l:LEG1},
 BL1:{n:"Bundesliga",f:"🇩🇪",z:[4,5,6,17],l:LEG1},
 FL1:{n:"Ligue 1",f:"🇫🇷",z:[4,5,6,17],l:LEG1},
 CL:{n:"Champions League",f:"🏆",z:[8,24,24,25],l:"<span style='color:#18c8ff'>■</span> Round of 16 &nbsp;<span style='color:#f5a623'>■</span> Playoff &nbsp;<span style='color:#e53935'>■</span> Out"}
};
function api(p){
 var u="https://"+lang+".wikipedia.org/w/api.php?format=json&origin=*";
 for(var k in p)u+="&"+k+"="+encodeURIComponent(p[k]);
 return fetch(u).then(function(r){return r.json()});
}
function setup(){
 document.getElementById("langs").innerHTML=Object.keys(LANGS).map(function(l){
  return "<button class='"+(l==lang?"on":"")+"' onclick='setLang(\""+l+"\")'>"+LANGS[l]+"</button>"}).join("");
 setupLeagues();
}
function setupLeagues(){
 document.getElementById("leagues").innerHTML=Object.keys(LG).map(function(k){
  return "<button class='liga-btn"+(k==cur?" sel":"")+"' onclick='openLeague(\""+k+"\")'>"+LG[k].f+" "+LG[k].n+"</button>"}).join
