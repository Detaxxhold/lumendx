name: Update data
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        env:
          KEY: ${{ secrets.FD_KEY }}
        run: |
          mkdir -p data
          for L in PD PL SA BL1 FL1 CL DED PPL ELC BSA; do
            for T in standings matches scorers; do
              Q=""
              if [ "$T" = "scorers" ]; then Q="?limit=20"; fi

              if [ "$T" = "matches" ]; then
                curl -sf -H "X-Auth-Token: $KEY" -H "X-Unfold-Lineups: true" "https://api.football-data.org/v4/competitions/$L/$T$Q" -o "data/${L}_$T.json" || echo "failed $L $T"
              else
                curl -sf -H "X-Auth-Token: $KEY" "https://api.football-data.org/v4/competitions/$L/$T$Q" -o "data/${L}_$T.json" || echo "failed $L $T"
              fi

              sleep 7
            done
          done

      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "update data" || exit 0
          git push
