name: Update data
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          KEY: ${{ secrets.FD_KEY }}
        run: |
          mkdir -p data
          curl -sf -H "X-Auth-Token: $KEY" "https://api.football-data.org/v4/competitions/PD/standings" -o data/standings.json
          curl -sf -H "X-Auth-Token: $KEY" "https://api.football-data.org/v4/competitions/PD/matches" -o data/matches.json
          curl -sf -H "X-Auth-Token: $KEY" "https://api.football-data.org/v4/competitions/PD/scorers?limit=20" -o data/scorers.json
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "update data" || exit 0
          git push
